name: RGB+CCT LED Panel Light(SHA5356)
products:
  - id: rc3ahhngdmciuhn9
    model: SHA5356

entities:
  - entity: light
    name: Panel
    dps:
      - id: 20
        type: boolean
        name: switch

      - id: 21
        type: string
        name: color_mode
        optional: true
        mapping:
          - dps_val: white
            value: color_temp
          - dps_val: colour
            value: hs
          - dps_val: scene
            value: scene
          - dps_val: music
            value: music

      - id: 22
        type: integer
        name: brightness
        optional: true
        range:
          min: 10
          max: 1000

      - id: 23
        type: integer
        name: color_temp
        optional: true
        range:
          min: 0
          max: 1000
        mapping:
          - target_range:
              min: 2700
              max: 6500

      - id: 24
        type: hex
        name: rgbhsv
        optional: true
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000

  - entity: text
    name: Mix light scene payload
    category: config
    dps:
      - id: 36
        type: base64
        name: value
        optional: true

  - entity: select
    name: Mix light scene preset
    category: config
    dps:
      - id: 36
        type: base64
        name: option
        optional: true
        mapping:
          - dps_val: "AMoAAAECA11dAQAAA+gD6F1dAQAAA+gACg=="
            value: "Red Alert"
          - dps_val: "AMsAAAEBAyUlAAB3A+gD6A=="
            value: "Green Alert"

  - entity: text
    name: Mix RGBCW payload
    category: config
    dps:
      - id: 51
        type: base64
        name: value
        optional: true

  - entity: select
    name: Mix RGBCW preset
    category: config
    dps:
      - id: 51
        type: base64
        name: option
        optional: true
        mapping:
          - dps_val: "AAUA7APoA+gBLwEV"
            value: "Default - WW 30%"
            default: true
          - dps_val: "AAUA7APoA+gD6AAA"
            value: "WW 100%"
          - dps_val: "AAUA7APoA+gB9AAA"
            value: "WW 50%"
          - dps_val: "AAUA7APoA+gACgAA"
            value: "WW 1%"
          - dps_val: "AAUA7APoA+gD6gHg"
            value: "WN 100%"
          - dps_val: "AAUA7APoA+gB9gHg"
            value: "WN 50%"
          - dps_val: "AAUA7APoA+gACgHg"
            value: "WN 1%"
          - dps_val: "AAYAAAPoA+gD6AAA"
            value: "RGB RED 100%"
          - dps_val: "AAYAAAPoA+gB9AAA"
            value: "RGB RED 50%"
          - dps_val: "AAYAAAPoAAoACgAA"
            value: "RGB RED 1%"
          - dps_val: "AAcAAAPoAAoACgAA"
            value: "WW+RED 100%"
          - dps_val: "AAcAAAPoAfMB8QAA"
            value: "WW+RED 50%"
          - dps_val: "AAcAAAPoA+gD6AAA"
            value: "WW+RED 1%"
